name: alto

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      <<: *database-environment
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
      APP_WORKERS: "${APP_WORKERS:-4}"
      HASH_KEY: "${HASH_KEY:-#StandWithtUkraineHP-TmGv-4z7h-1xaQp0RYuY20=}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      SECRET_KEY: "${SECRET_KEY:-django-insecure-docker-development-only}"
    volumes:
      - theme_data:/app/theme
      - static_data:/app/elearning/static
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      theme:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: postgres:18.6
    environment: *database-environment
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  theme:
    build:
      context: ../theme
      dockerfile: docker/Dockerfile
    volumes:
      - theme_data:/app/theme
    restart: no

  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  theme_data:
