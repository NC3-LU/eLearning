[tool.poetry]
name = "elearning"
version = "1.0.0"
description = ""
authors = ["Juan Rocha <juan.rocha@nc3.lu>"]
license = "AGPL-3.0-or-later"
readme = "README.md"

homepage = "https://github.com/NC3-LU/eLearning"
repository = "https://github.com/NC3-LU/eLearning"

[tool.poetry.dependencies]
python = ">=3.12,<4"
django = ">=6.0,<7"
psycopg2-binary = "^2.8.4"
django-bootstrap5 = ">=26.2,<27"
django-import-export = ">=4.4.0,<5"
django-parler = ">=2.4,<3"
django-cookiebanner = ">=0.2.8,<0.3"
weasyprint = ">=70.0,<71"
gunicorn = ">=23,<24"


[tool.poetry.group.dev.dependencies]
flake8 = ">=7.3,<8"
pre-commit = "^2.20.0"
black = "^24.3.0"
pyupgrade = "^3.2.2"
pip-audit = "^2.5.4"
isort = "^5.12.0"
django-debug-toolbar = ">=6.0,<7"

[tool.poetry.group.docs.dependencies]
sphinx-book-theme = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
